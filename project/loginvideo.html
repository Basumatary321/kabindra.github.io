<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
       *{
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }
       body{
           height: 100vh;
           overflow: hidden;
       }
#bgVideo{
   position: fixed;
   right: 0;
   left: 0;
   min-height: 100%;
   min-height: 100%;
   object-fit: cover;
   z-index: -2;
}
.overlay{
   position: fixed;
   width: 100%;
   height: 100%;
   background: rgba(0, 0, 0, 0.253);
   z-index: -1;
   
}
.login-container{
   position: absolute;
   top: 50%;
   left: 50%;
   transform: translate(-50%,-50%);
   width: 420px;
   padding: 35px;
   background-color: rgba(255,255,255,0.1);
   backdrop-filter: blur(5px);
   border-radius: 12px;
   text-align: center;
   color:white;
   box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
}
.login-container h2{
   margin-bottom: 20px;
}
.login-container input{
   width: 100%;
   padding: 12px;
   margin: 10px 0;
   font-size: 16px;
   color: rgb(241, 20, 149);
   border: none;
   border-radius: 6px;
   outline: none;
   background: rgba(255, 255, 255, 0.479);
}
.login-container input[type="submit"]{
   width: 100%;
   padding: 12px;
   margin-bottom: 10px;
   border: none;
   border-radius: 6px;
   background-color: #00bcd4;
   color: white;
   font-size: 16px;
   cursor: pointer;
   transition: 0.3s;
}
.login-container input[type="submit"]:hover{
   background: #0097a7;
}
@media (max-width:768px) {
    .login-container{
        width: 350px;
    }
}
   </style>
</head>
<body>
<!-- background -->
<video src="../assets/vid4.mp4" autoplay muted loop playsinline id="bgVideo"></video>
   
<div class="overlay"></div>
   <!-- loginbox -->
    <div class="login-container">
       <h2>Login</h2>
       <form action="">
           <input type="text" placeholder="Id">
           <input type="password" placeholder="password">
           <input type="submit">
       </form>
    </div>
</body>
</html>
