<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Background Login</title>

<style>

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
}

/* ================= VIDEO BACKGROUND ================= */
#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Overlay */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* ================= LOADER ================= */
#loader{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:9999;
}

/* Spinner */
.spinner{
    width:55px;
    height:55px;
    border:5px solid rgba(255,255,255,0.2);
    border-top:5px solid #00bcd4;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:15px;
}

@keyframes spin{
    100%{ transform:rotate(360deg); }
}

/* ================= LOGIN BOX ================= */
.login-container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    padding:35px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(2px);
    border-radius:12px;
    text-align:center;
    color:white;
    box-shadow:0 0 20px rgba(0,0,0,0.3);

    /* Hidden until video loads */
    opacity:0;
    transition:opacity 0.8s ease;
}

.login-container h2{
    margin-bottom:20px;
}

.login-container input{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:16px;
    color:#e91e63;
    border:none;
    border-radius:6px;
    outline:none;
    background:rgba(255,255,255,0.5);
}

.login-container input[type="submit"]{
    background:#00bcd4;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.login-container input[type="submit"]:hover{
    background:#0097a7;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
    .login-container{
        width:350px;
    }
}

</style>
</head>

<body>

<!-- ========= LOADING SCREEN ========= -->
<div id="loader">
    <div class="spinner"></div>
    <p>Loading Background...</p>
</div>

<!-- ========= VIDEO BACKGROUND ========= -->
<video autoplay muted loop playsinline id="bgVideo">
    <source src="../assets/vid4.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- ========= LOGIN BOX ========= -->
<div class="login-container">
    <h2>Login</h2>
    <form>
        <input type="text" placeholder="ID" required>
        <input type="password" placeholder="Password" required>
        <input type="submit" value="Login">
    </form>
</div>

<!-- ========= JAVASCRIPT ========= -->
<script>

const video = document.getElementById("bgVideo");
const loader = document.getElementById("loader");
const loginBox = document.querySelector(".login-container");

/* Show login only after video fully ready */
video.addEventListener("canplaythrough", function () {
    loader.style.display = "none";
    loginBox.style.opacity = "1";
});

/* Backup safety (slow internet fix) */
setTimeout(() => {
    loader.style.display = "none";
    loginBox.style.opacity = "1";
}, 5000);

</script>

</body>

</html>
