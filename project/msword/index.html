 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Word Practice App</title>

<style>
:root {
    --primary: #00c6ff;
    --success: #28a745;
    --download: #4a5568;
    --dark-bg: #0b0b0b;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--dark-bg);
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* Header */
.header {
    background: linear-gradient(135deg, #07376b, #6612ec);
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

/* Progress */
.progress-section {
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 12px;
    background: #111;
}

.progress-container {
    flex: 1;
    height: 8px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.4s ease;
}

.progress-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    min-width: 50px;
    text-align: right;
}

/* Viewer */
.viewer {
    flex: 1;
    position: relative;
    /* background: #000; */
    background: url("images/background.svg");
    background-size: cover;
    max-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 5px 10px;
    border-radius: 12px;
    overflow: hidden;
}

.viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* Action Buttons */
.action-group {
    position: absolute;
    bottom: 8px;
    right: 15px;
    display: flex;
    gap: 8px;
}

.btn-style {
    border: none;
    padding: 5px 14px;
    border-radius: 30px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.download-btn {
    background: var(--download);
}

.complete-btn {
    background: var(--success);
}

.complete-btn:disabled {
    background: #444;
    color: #aaa;
}

/* Instruction */
.instruction {
    text-align: center;
    font-size: 13px;
    color: #aaa;
    padding: 2px;
}

/* Thumbnails */
.thumbnails {
    display: flex;
    overflow-x: auto;
    padding: 10px;
    gap: 10px;
}

.thumb {
    position: relative;
}

.thumb img {
    width: 80px;
    height: 55px;
    border-radius: 6px;
    object-fit: cover;
    opacity: 0.7;
}

.thumb img.active {
    opacity: 1;
    border: 2px solid var(--primary);
}

/* Tick */
.tick {
    position: absolute;
    top: -5px;
    right: -5px;
    background: var(--success);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    display: none;
    align-items: center;
    justify-content: center;
}
</style>
</head>

<body>

<div class="header">MS Word Practice</div>

<div class="progress-section">
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 0</div>
</div>
<div class="instruction">
    👉 Slide left or right to continue
</div>
<div class="viewer" id="viewer">
    
    <img id="slide">

    <div class="action-group">
        <button class="btn-style download-btn" onclick="downloadImage()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 24 15">
        <path d="M12 16l4-5h-3V4h-2v7H8l4 5zm-7 4h14v-2H5v2z"/>
    </svg>
    Download
</button>
         <button id="completeBtn" class="btn-style complete-btn" onclick="markComplete()">Mark Completed</button>
    </div>
</div>



<div class="thumbnails" id="thumbs"></div>

<script>

const images = [
    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg",
    "images/5.jpg",
    "images/6.jpg",
    "images/7.jpg",
    "images/8.jpg",
    "images/9.jpg",
    "images/10.jpg",
    "images/11.jpg",
    "images/12.jpg",
    "images/13.jpg",
    "images/14.jpg",
    "images/15.jpg",
    "images/16.jpg",
    "images/17.jpg",
    "images/18.jpg",
    "images/19.jpg",
    "images/20.jpg",
    "images/21.jpg",
    "images/22.jpg",
    "images/23.jpg",
    "images/24.jpg",
    "images/25.jpg",
    "images/26.jpg"
    // "images/27.jpg",
];

let current = 1;
const total = images.length;

/* Thumbnails */
const thumbs = document.getElementById("thumbs");

images.forEach((src, i) => {
    let div = document.createElement("div");
    div.className = "thumb";

    let img = document.createElement("img");
    img.src = src;

    let tick = document.createElement("div");
    tick.className = "tick";
    tick.innerHTML = "✔";

    div.appendChild(img);
    div.appendChild(tick);

    img.onclick = () => {
        current = i + 1;
        loadSlide();
    };

    thumbs.appendChild(div);
});

/* Load Slide */
function loadSlide() {
    let img = document.getElementById("slide");
    let btn = document.getElementById("completeBtn");

    img.src = images[current - 1];

    document.querySelectorAll(".thumb").forEach((el, i) => {
        el.querySelector("img").classList.toggle("active", i + 1 === current);
        el.querySelector(".tick").style.display =
            localStorage.getItem("slide_" + (i+1)) === "true" ? "flex" : "none";
    });

    let completed = 0;
    for (let i = 1; i <= total; i++) {
        if (localStorage.getItem("slide_" + i) === "true") completed++;
    }

    document.getElementById("progressBar").style.width = (completed / total * 100) + "%";
    document.getElementById("progressText").innerText = completed + " / " + total;

    if (localStorage.getItem("slide_" + current) === "true") {
        btn.innerText = "✔ Completed";
        btn.disabled = true;
    } else {
        btn.innerText = "Mark Completed";
        btn.disabled = false;
    }
}

/* Mark Complete */
function markComplete() {
    localStorage.setItem("slide_" + current, "true");
    loadSlide();
}

/* Download */
function downloadImage() {
    const link = document.createElement("a");
    link.href = images[current - 1];
    link.download = "MS_Word_" + current + ".jpg";
    link.click();
}

/* Swipe */
let startX = 0;

document.getElementById("viewer").addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

document.getElementById("viewer").addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;

    if (startX - endX > 50 && current < total) {
        current++;
        loadSlide();
    }

    if (endX - startX > 50 && current > 1) {
        current--;
        loadSlide();
    }
});

loadSlide();

</script>

</body>
</html>
