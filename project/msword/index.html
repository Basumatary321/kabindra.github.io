  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Word Practice App</title>

    <style>
        :root {
            --primary: #00c6ff;
            --success: #28a745;
            --download: #4906e6;
            --dark-bg: #0b0b0b;
            --header-gradient: linear-gradient(135deg, #07376b, #6612ec);
        }

        /* Full Height Layout */
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--dark-bg);
            color: white;
            display: flex;
            flex-direction: column;
           height: 100dvh;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--header-gradient);
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Progress Section */
        .progress-section {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            gap: 12px;
            background: #111;
            flex-shrink: 0;
        }

        .progress-container {
            flex: 1;
            height: 8px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            min-width: 50px;
            text-align: right;
        }

        .stats-subtext {
            text-align: right;
            margin: 0 15px 5px 0;
            font-size: 10px;
            color: var(--primary);
            flex-shrink: 0;
        }

        /* Centered Viewer Area */
        .viewer {
            flex: 1; /* Takes all available middle space */
            position: relative;
            background: url("images/background.svg") center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Action Buttons */
        .action-group {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .Btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .download-btn { background-color: var(--download); }
        .complete-btn { background-color: var(--success); }

        .svgIcon { fill: white; width: 1.2em; height: 1.2em; }
        
        .icon2 {
            width: 18px;
            height: 4px;
            border: 2px solid white;
            border-top: none;
            margin-top: -2px;
        }

        .Btn:disabled {
            background-color: #444;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Thumbnails Bottom Section */
        .bottom-section {
            background: #000;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .instruction {
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 8px 0 0 0;
        }

        .thumbnails {
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 10px;
            scroll-behavior: smooth; /* Enables smooth sliding */
            -webkit-overflow-scrolling: touch;
        }

        .thumb { position: relative; flex-shrink: 0; }
        
        .thumb img {
            width: 85px;
            height: 55px;
            border-radius: 6px;
            object-fit: cover;
            opacity: 0.4;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .thumb img.active {
            opacity: 1;
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .tick {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--success);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 11px;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            border: 1px solid black;
            z-index: 2;
        }

        /* Animations */
        .fade-slide {
            animation: fadeSlide 0.3s ease-out;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
      /* Enhanced Viewer for Zoom */
.viewer {
    overflow: hidden; /* Vital for contained zoom */
    touch-action: none; /* Prevents browser pull-to-refresh while zooming */
    background: #000;
}

#slide {
    transition: transform 0.1s ease-out; /* Smooth follow-through */
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
}
      
    </style>
</head>

<body>

<div class="header">MS Word Practice</div>

<div class="progress-section">
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 0</div>
</div>
<div class="stats-subtext">Completed / Total</div>

<div class="viewer" id="viewer">
    <img id="slide">
    
    <div class="action-group">
        <button class="Btn download-btn" onclick="downloadImage()">
            <svg class="svgIcon" viewBox="0 0 384 512"><path d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z"></path></svg>
            <span class="icon2"></span>
        </button>

        <button id="completeBtn" class="Btn complete-btn" onclick="markComplete()">
            <svg class="svgIcon" viewBox="0 0 448 512"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"></path></svg>
        </button>
    </div>
</div>

<div class="bottom-section">
    <div class="instruction">
        &lt; Swipe left/right on image to change &gt; or &lt; Select below &gt;
    </div>
    <div class="thumbnails" id="thumbs"></div>
</div>

<script>
// Configuration
const images = Array.from({length: 26}, (_, i) => `images/${i+1}.jpg`);
let current = 1;
const total = images.length;
const thumbsContainer = document.getElementById("thumbs");
const slideImg = document.getElementById("slide");

// Zoom/Pan State
let scale = 1;
let pointX = 0;
let pointY = 0;
let start = { x: 0, y: 0 };
let isDragging = false;
let lastDist = 0;
let lastTap = 0;

// 1. Initialize Thumbnails (Same as before)
images.forEach((src, i) => {
    let div = document.createElement("div");
    div.className = "thumb";
    let img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    let tick = document.createElement("div");
    tick.className = "tick";
    tick.innerHTML = "✔";
    div.appendChild(img);
    div.appendChild(tick);
    img.onclick = () => { current = i + 1; loadSlide(); };
    thumbsContainer.appendChild(div);
});

// 2. Load Slide (Enhanced with Zoom Reset)
function loadSlide() {
    resetZoom(); // Reset zoom whenever image changes
    
    slideImg.classList.remove("fade-slide");
    setTimeout(() => {
        slideImg.src = images[current - 1];
        slideImg.classList.add("fade-slide");
    }, 50);

    // Update Progress & Thumbs
    let completedCount = 0;
    document.querySelectorAll(".thumb").forEach((el, i) => {
        const isCurrent = (i + 1 === current);
        el.querySelector("img").classList.toggle("active", isCurrent);
        const isDone = localStorage.getItem("slide_" + (i+1)) === "true";
        if (isDone) completedCount++;
        el.querySelector(".tick").style.display = isDone ? "flex" : "none";
        if (isCurrent) el.scrollIntoView({ behavior: 'smooth', inline: 'center' });
    });

    document.getElementById("progressBar").style.width = (completedCount / total * 100) + "%";
    document.getElementById("progressText").innerText = `${completedCount} / ${total}`;
    document.getElementById("completeBtn").disabled = localStorage.getItem("slide_" + current) === "true";
}

// 3. Transformation Logic
function resetZoom() {
    scale = 1;
    pointX = 0;
    pointY = 0;
    updateTransform();
}

function updateTransform() {
    // Apply the transformation
    slideImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
}

// 4. Touch & Mouse Events (Pinch, Drag, Double Tap)
const viewer = document.getElementById("viewer");

viewer.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
        // Double Tap Detection
        const now = Date.now();
        if (now - lastTap < 300) {
            if (scale > 1) resetZoom();
            else scale = 2.5; 
            updateTransform();
            return;
        }
        lastTap = now;

        // Start Dragging
        isDragging = true;
        start = { x: e.touches[0].clientX - pointX, y: e.touches[0].clientY - pointY };
    } else if (e.touches.length === 2) {
        // Start Pinching
        isDragging = false;
        lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    }
});

viewer.addEventListener("touchmove", (e) => {
    e.preventDefault(); // Stop page scroll

    if (e.touches.length === 1 && isDragging) {
        // Dragging Logic
        pointX = e.touches[0].clientX - start.x;
        pointY = e.touches[0].clientY - start.y;
        
        // If not zoomed in, allow swipe to change image
        if (scale === 1) {
            let diff = e.touches[0].clientX - (start.x + pointX); // Basic swipe detection
        }
        updateTransform();
    } else if (e.touches.length === 2) {
        // Pinch Zoom Logic
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        const zoomSens = 0.01;
        const delta = (dist - lastDist) * zoomSens;
        
        scale = Math.min(Math.max(1, scale + delta), 4); // Min 1x, Max 4x
        lastDist = dist;
        updateTransform();
    }
}, { passive: false });

viewer.addEventListener("touchend", (e) => {
    if (scale === 1 && isDragging) {
        const deltaX = (e.changedTouches[0].clientX - (start.x + pointX));
        // Swipe triggers only if not zoomed
        if (pointX > 80 && current > 1) { current--; loadSlide(); }
        else if (pointX < -80 && current < total) { current++; loadSlide(); }
        else { resetZoom(); }
    }
    isDragging = false;
});

// 5. Mouse Wheel Zoom (Desktop)
viewer.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY * -0.01;
    scale = Math.min(Math.max(1, scale + delta), 4);
    updateTransform();
}, { passive: false });

// Global functions
function markComplete() { localStorage.setItem("slide_" + current, "true"); loadSlide(); }
function downloadImage() {
    const link = document.createElement("a");
    link.href = images[current - 1];
    link.download = `MS_Word_Practice_${current}.jpg`;
    link.click();
}

loadSlide();
  
</script>

</body>
</html>
