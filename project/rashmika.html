 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rashmika</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
   div{
    border-top: 4px solid blue;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    height: 500px;
    width: 500px;
    padding: 10px;
    background: linear-gradient(to bottom, white, purple);
    /* box-shadow: 10px 2px 15px black; */
   }
   img{
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 2px solid orange;
   }
   #in{
    color: white;
    margin: 10px 0;
   }
   h1{
    color: rgb(47, 8, 185);
    text-shadow: 0 0 5px white;
   }
   hr{
    margin: 10px
   }
   #intro{
    color: rgb(223, 223, 12);
    text-align: justify;
   }
     @media (max-width: 768px) {
       div{
        width: 400px;
       }
     }
  </style>
 </head>
 <body>
  <div>
<img src="../images/rashmika.jpg" alt="">
<h1>Rashmika Mandanna</h1>
<hr width="90%" color="white">
<p id="in">Actress | 5 Apr 1996 | MS Ramaiah College</p>
<hr width="90%" color="white">
<p id="intro">
  Rashmika Mandanna (born 5 April 1996) is an Indian actress who primarily
   works in Telugu and Hindi films. Her accolades include four SIIMA Awards
    and a Filmfare Award South. 
</p>

  </div>
 </body>
 </html>
