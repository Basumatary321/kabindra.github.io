 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: white;
            /* font-family: Arial, sans-serif; */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1{
            font-size: 60px;
            /* font-family: Arial, sans-serif; */
        }
        .instruction{
            /* font-size: 20px; */
            color: rgb(144, 139, 139);
            border: 2px solid rgb(207, 206, 206);
            padding: 10px;
            max-width: 600px;
            /* border-radius: 10px; */
            position: relative;
        }
        .blue{
            color: blue;
        }
        .red{
            color: red;
        }
        .orange{
            color: orange;
        }
        .green{
            color: green;
        }
        .imp{
            color: rgb(84, 83, 84);
            font-weight: bold;
        }
        .instruction .top{
           margin:0;padding:2px;
           font-weight: 100;
           border-bottom: 1px solid rgb(207, 206, 206);
           position: absolute;
            top:0;
            left: 0;
            background-color: rgb(200, 191, 191);
            color: white;
        }
    </style>
</head>
<body bgcolor="white">
    <h1 align="center">
<span class="blue">G</span>
<span class="red">o</span>
<span class="orange">o</span>
<span class="blue">g</span>
<span class="green">l</span>
<span class="red">e</span>

</h1> 
<div class="instruction">
    <span class="top">Instruction:</span>
    <!-- <p>This is a simple instruction for the Google font display.</p> -->
    <ol>
    <li>Use <span class="imp"> &lt;span&gt;</span> elements to apply the CSS classes to each letter.</li>
    <li>add different CSS <span class="imp">Classes</span> classes for each color.</li>
        <li>CSS: Select with classes and apply the 
            color to each letter.</li>
</ol>
    


</div>
</body>
</html>
