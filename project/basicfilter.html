  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Image Editor PRO</title>
<style>
     /* ================= GLOBAL ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:#1b1b1b;
color:#eee;
padding:20px;
height:100vh;
overflow:hidden; 
}

img{
max-width:100%;
height:auto;
}

/* ================= LAYOUT ================= */

.main{
max-width:1350px;
margin:auto;
display:grid;
grid-template-columns:1.3fr 1fr;
gap:20px;
height:calc(100vh - 40px); /* full editor height */
}


.left{
background:#242424;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px rgba(0,0,0,.6);

position:sticky;
top:0;
height:100%;
overflow:hidden;
}

.image-area{
height:500px;
background:#111;
border:3px dashed #00b894;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
position:relative;
cursor:pointer;
}

.image-area img{
max-width:95%;
max-height:95%;
transition:.2s;
}

.placeholder{
color:#888;
font-size:18px;
}


.controls{
margin-top:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
white-space:nowrap;
}

.upload{background:#0984e3;color:#fff;}
.download{background:#00b894;color:#fff;}
.reset{background:#d63031;color:#fff;}
.toggle{background:#6c5ce7;color:#fff;}


.right{
background:#242424;
padding:18px;
border-radius:10px;

display:flex;
flex-direction:row;
flex-wrap:wrap;
gap:15px;

height:100%;
overflow-y:auto;   
overflow-x:hidden;
}


.card{
background:#2f2f2f;
padding:1px;
border-radius:8px;
margin-bottom:15px;
min-width:0;
}


.card1,
.card2{
flex:1 1 calc(50% - 8px);
}

.card3{
flex:1 1 100%;
}

.card h3{
background:#0984e3;
padding:7px 10px;
border-radius:5px;
font-size:14px;
margin-bottom:12px;
}


.filter{
margin-bottom:12px;
padding:2px 10px;
}

.filter label{
font-size:13px;
display:flex;
justify-content:space-between;
margin-bottom:4px;
}

.filter input{
width:100%;
accent-color:#00cec9;
}


.resize{
padding:5px 10px;
}

.resize input,
.resize select{
width:100%;
padding:7px;
margin-bottom:8px;
border-radius:5px;
border:none;
}


textarea{
width:100%;
height:80px;
background:#111;
color:#00ff9f;
border:none;
padding:10px;
font-family:monospace;
resize:none;
}
/* ================= COPY BUTTON PRO ================= */

.cssHeader{
display:flex;
justify-content:space-between;
align-items:center;
}

.copyBtn{
background:#0984e3;
color:#fff;
border:none;
width:32px;
height:28px;
border-radius:6px;
cursor:pointer;
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
transition:.25s;
}

/* hover effect */
.copyBtn:hover{
transform:translateY(-1px);
box-shadow:0 4px 10px rgba(0,0,0,.4);
}

/* copied animation */
.copyBtn.copied{
background:#00b894;
transform:scale(1.1);
}



@media(max-width:900px){

body{
padding:12px;
height:auto;
overflow:auto;
}

.main{
grid-template-columns:1fr;
height:auto;
gap:15px;
}

.image-area{
height:350px;
}

.right{
height:auto;
overflow:visible;
padding:12px;
}

.card{
min-width:0;
}

}

</style>
</head>

<body>

<div class="main">

<!-- LEFT -->
<div class="left">

<div id="drop" class="image-area">
<div class="placeholder">Drag & Drop Image</div>
<img id="img">
</div>

<div class="controls">
<input type="file" id="upload" hidden accept="image/*">
<button class="upload" id="uploadBtn">Upload</button>
<button class="download" onclick="download()">Download</button>
<button class="reset" onclick="resetAll()">Reset</button>
 </div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="card card1">
<h3>Filters</h3>

<div id="filters"></div>

</div>

<div class="card resize card2">
<h3>Resize</h3>

<input type="number" id="width" placeholder="Width">
<input type="number" id="height" placeholder="Height">

<select id="unit">
<option value="px">px</option>
<option value="%">%</option>
</select>

<button onclick="resizeImage()">Apply Resize</button>
</div>

 <div class="card card3">

<h3 class="cssHeader">
Generated CSS

<button class="copyBtn" onclick="copyCSS()" title="Copy CSS">
📋
</button>

</h3>

<textarea id="cssCode" readonly></textarea>

</div>



</div>

</div>

<script>

/* ================= VARIABLES ================= */

const img=document.getElementById("img");
const upload=document.getElementById("upload");
const drop=document.getElementById("drop");
const placeholder=document.querySelector(".placeholder");

let beforeMode=false;

/* FILTER CONFIG */
const filterConfig=[
["brightness",100,0,200,"%"],
["contrast",100,0,200,"%"],
["saturate",100,0,200,"%"],
["grayscale",0,0,100,"%"],
["invert",0,0,100,"%"],
["sepia",0,0,100,"%"],
["opacity",100,0,100,"%"],
["hue-rotate",0,0,360,"deg"],
["blur",0,0,10,"px"],
["zoom",1,0.5,2,""]
];

const filtersDiv=document.getElementById("filters");

/* CREATE SLIDERS AUTO */
filterConfig.forEach(f=>{
const wrap=document.createElement("div");
wrap.className="filter";

wrap.innerHTML=`
<label>${f[0]} <span id="${f[0]}Val">${f[1]}</span></label>
<input type="range" id="${f[0]}" min="${f[2]}" max="${f[3]}" step="0.1" value="${f[1]}">
`;

filtersDiv.appendChild(wrap);

document.getElementById(f[0]).addEventListener("input",applyFilters);
});

/* ================= IMAGE LOAD ================= */

uploadBtn.onclick=()=>upload.click();

upload.onchange=e=>{
loadImage(e.target.files[0]);
};

drop.ondragover=e=>{e.preventDefault();}
drop.ondrop=e=>{
e.preventDefault();
loadImage(e.dataTransfer.files[0]);
};

function loadImage(file){
const reader=new FileReader();
reader.onload=()=>{
img.src=reader.result;
placeholder.style.display="none";
};
reader.readAsDataURL(file);
}

/* ================= FILTER APPLY ================= */

function applyFilters(){

let filterString="";
let zoom=1;

filterConfig.forEach(f=>{
const val=document.getElementById(f[0]).value;
document.getElementById(f[0]+"Val").innerText=val;

if(f[0]==="zoom"){
zoom=val;
}else{
filterString+=`${f[0]}(${val}${f[4]}) `;
}
});

img.style.filter=filterString;
img.style.transform=`scale(${zoom})`;

document.getElementById("cssCode").value=
`#img{
filter:${filterString};
transform:scale(${zoom});
}`;
}

/* ================= RESET ================= */

function resetAll(){
filterConfig.forEach(f=>{
document.getElementById(f[0]).value=f[1];
});
applyFilters();
}

/* ================= BEFORE AFTER ================= */

function togglePreview(){
beforeMode=!beforeMode;
img.style.filter=beforeMode?"none":img.style.filter;
}

/* ================= RESIZE ================= */

function resizeImage(){
const w=document.getElementById("width").value;
const h=document.getElementById("height").value;
const u=document.getElementById("unit").value;

if(w) img.style.width=w+u;
if(h) img.style.height=h+u;
}

/* ================= MOUSE WHEEL ZOOM ================= */

drop.addEventListener("wheel",e=>{
e.preventDefault();
let zoom=document.getElementById("zoom");
zoom.value=Math.min(2,Math.max(0.5,parseFloat(zoom.value)-(e.deltaY*0.001)));
applyFilters();
});

/* ================= DOWNLOAD ================= */

function download(){

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;

ctx.filter=getComputedStyle(img).filter;
ctx.drawImage(img,0,0,canvas.width,canvas.height);

const link=document.createElement("a");
link.download="edited-image.png";
link.href=canvas.toDataURL();
link.click();
}
/* ================= MOBILE SAFE COPY ================= */

function copyCSS(){

const textarea = document.getElementById("cssCode");
const btn = document.querySelector(".copyBtn");

const text = textarea.value;

/* modern clipboard */
if(navigator.clipboard){

navigator.clipboard.writeText(text).then(successCopy);

}else{

/* fallback for older mobile browsers */
textarea.select();
textarea.setSelectionRange(0,99999);
document.execCommand("copy");
successCopy();

}

function successCopy(){
btn.classList.add("copied");
btn.innerText="✔";

setTimeout(()=>{
btn.classList.remove("copied");
btn.innerText="📋";
},1500);
}

}


</script>
</body>
</html>
