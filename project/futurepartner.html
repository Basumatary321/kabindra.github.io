   <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Partner Selector 😄</title>
<meta property="og:title" content="Future Partner Selector 😄">
<meta property="og:description" content="This page is specially designed to help you select your ideal future partner based on traits you desire.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://basumatary321.github.io/kabindra.github.io/project/futurepartner.html">
<meta property="og:image" content="https://basumatary321.github.io/kabindra.github.io/images/meta/fahh2.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Future Partner Selector 😄">
<meta name="twitter:description" content="This page is specially designed to help you select your ideal future partner based on traits you desire.">
<meta name="twitter:image" content="https://basumatary321.github.io/kabindra.github.io/images/meta/fahh2.jpg">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Roboto",sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#1672fc,#28034d);
  padding:20px;
  color:#fff;
}

.container{
  width:100%;
  max-width:1000px;
  text-align:center;
}

h2{
  margin-bottom:25px;
  font-size:clamp(1rem, 2.5vw, 4rem);
}

.toggle-area{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:30px;
}

.toggle-container{
  display:flex;
  align-items:center;
  justify-content:start;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  padding:12px;
  border-radius:15px;
  transition:.3s;
}



.toggle{
  visibility:hidden;
}

.label{
  background:#ccc;
  border-radius:50px;
  cursor:pointer;
  width:70px;
  height:36px;
  margin:0 12px;
  position:relative;
  transition:.3s;
}

.ball{
  background:#fff;
  width:30px;
  height:30px;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.3s;
}

/* ACTIVE COLORS */
#beautiful:checked + .label{background:#ff6ec7;}
#ugly:checked + .label{background:#7f8c8d;}
#intelligent:checked + .label{background:#3498db;}
#educated:checked + .label{background:#2ecc71;}
#uneducated:checked + .label{background:#e74c3c;}
#cantcook:checked + .label{background:#f39c12;}

.toggle:checked + .label .ball{
  transform:translateX(34px);
}

.meme-card{
  background:transparent;
  backdrop-filter: blur(1px);
  color:#ffffff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  transition:.4s;
  animation:fadeIn .4s ease;
}

.meme-text{
  font-size:18px;
  white-space:pre-line;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:500px){
  h2{font-size:20px;}
  .meme-card{padding:18px;}
  .meme-text{font-size:16px;}
}

</style>
</head>

<body>

<div class="container">

<h2>What do you want your future partner to be like? 😄</h2>

<div class="toggle-area">

<div class="toggle-container">
<input type="checkbox" id="beautiful" class="toggle">
<label for="beautiful" class="label"><div class="ball"></div></label>
<span>नायनो समायना <br> (Beautiful)</span>
</div>

<div class="toggle-container">
<input type="checkbox" id="ugly" class="toggle">
<label for="ugly" class="label"><div class="ball"></div></label>
<span>महर गाज्रि <br>(Ugly)</span>
</div>

<div class="toggle-container">
<input type="checkbox" id="intelligent" class="toggle">
<label for="intelligent" class="label"><div class="ball"></div></label>
<span>जेरावबो आखा फाखा <br>(Intelligent)</span>
</div>

<div class="toggle-container">
<input type="checkbox" id="educated" class="toggle">
<label for="educated" class="label"><div class="ball"></div></label>
<span>लेखा गोरों <br> (Educated)</span>
</div>

<div class="toggle-container">
<input type="checkbox" id="uneducated" class="toggle">
<label for="uneducated" class="label"><div class="ball"></div></label>
<span>लेखा रोङि <br>(Uneducated)</span>
</div>

<div class="toggle-container">
<input type="checkbox" id="cantcook" class="toggle">
<label for="cantcook" class="label"><div class="ball"></div></label>
<span>खामानियाव उदाय रोंङा <br>Can't Cook 🍳</span>
</div>

</div>

<div class="meme-card">
   <div id="memeText" class="meme-text">
  गोजोवआव होनायखौ बासिना लादो 😆
   </div>
</div>

</div>

<script>

const beautiful = document.getElementById("beautiful");
const ugly = document.getElementById("ugly");
const intelligent = document.getElementById("intelligent");
const educated = document.getElementById("educated");
const uneducated = document.getElementById("uneducated");
const cantcook = document.getElementById("cantcook");
const memeText = document.getElementById("memeText");

const clickSound = new Audio(
"../assets/fahh.mp3"
);

function applyLogic(clicked){

clickSound.currentTime = 0;
clickSound.play();

/* BEAUTIFUL */
if(clicked === beautiful && beautiful.checked){
  intelligent.checked = false;
  educated.checked = false;
  ugly.checked = false;
  cantcook.checked=true;
}

/* INTELLIGENT */
if(clicked === intelligent && intelligent.checked){
  beautiful.checked = false;
  cantcook.checked=false;
  educated.checked=true;
  ugly.checked=true;
}

/* EDUCATED */
if(clicked === educated && educated.checked){
  beautiful.checked = false;
  uneducated.checked = false;
  ugly.checked=true;
}

/* UNEDUCATED */
if(clicked === uneducated && uneducated.checked){
  educated.checked = false;
  intelligent.checked=false;
}

/* UGLY */
if(clicked === ugly && ugly.checked){
  beautiful.checked = false;
}
/* cook */
if(clicked === cantcook && cantcook.checked){
 intelligent.checked=false;
}

updateMeme();
}

function updateMeme(){

/* ---------- 3 TRAIT COMBINATIONS FIRST ---------- */

if(beautiful.checked && uneducated.checked && cantcook.checked){
memeText.innerText =
"🌸 Beautiful, Uneducated & Can't Cook 🍳\n\nFull maintenance mode activated.\nLove is blind… and hungry.";
}

else if(intelligent.checked && educated.checked && ugly.checked){
memeText.innerText =
"🧠🎓 Genius but NO Selfie😅\n\nBrains level: Einstein\nInstagram level: Airplane mode.";
}

else if(beautiful.checked && intelligent.checked && educated.checked){
memeText.innerText =
"🔥 Impossible Combo!\n\nBeauty + Brains + Degree?\nMain character energy!";
}

/* ---------- 2 TRAIT COMBINATIONS ---------- */

else if(beautiful.checked && cantcook.checked){
memeText.innerText =
"✨ Beautiful but Can't Cook 🍳\n\nSwiggy & Zomato subscription नि गोनांथि.";
}

else if(beautiful.checked && uneducated.checked){
memeText.innerText =
"🌸 Beautiful but No Degree 🎓❌\n\nHeart over homework.";
}

else if(beautiful.checked && ugly.checked){
memeText.innerText =
"🤯 Quantum Partner\n\nSimultaneously Beautiful & Ugly.\nSchrödinger approves.";
}

else if(intelligent.checked && educated.checked){
memeText.innerText =
"🧠🎓 Brainy Powerhouse!\n\nFuture CEO vibes.";
}

else if(intelligent.checked && cantcook.checked){
memeText.innerText =
"🧠 Smart but Can't Cook 🍳\n\nWill calculate recipe ratios\nbut burn the kitchen.";
}

else if(educated.checked && cantcook.checked){
memeText.innerText =
"🎓 Degree Holder but Can't Cook 🍜\n\nMaster's in theory,\nPhD in Maggi.";
}
else if(educated.checked && cantcook.checked && ugly.checked){
memeText.innerText =
"🎓 Degree Holder but Can't Cook 🍜 average look\n\nMaster's in theory,\nPhD in Maggi.";
}

else if(uneducated.checked && cantcook.checked){
memeText.innerText =
"😅 No Degree & Can't Cook\n\nLife skills DLC not installed.";
}

else if(ugly.checked && cantcook.checked){
memeText.innerText =
"😬 Tough Combo!\n\nPersonality better be legendary.";
}

else if(ugly.checked && intelligent.checked){
memeText.innerText =
"🧠 Smart but Not Attractive 😅\n\nDeep talks, no filters.";
}

/* ---------- SINGLE TRAITS ---------- */

else if(beautiful.checked){
memeText.innerText =
"😍 Beautiful Partner\n\nLooks level: Legendary.";
}

else if(intelligent.checked){
memeText.innerText =
"🤓 Intelligent Partner\n\nDeep talks at 2AM.";
}


else if(educated.checked && ugly.checked){
memeText.innerText =
"Officer Wife 👮‍♀️\n\nDegree unlocked.Looks optional";
}

else if(uneducated.checked){
memeText.innerText =
"🎒 Street Smart Mode\n\nLife > Books.";
}

else if(ugly.checked){
memeText.innerText =
"😅 Personality matters more.";
}

else if(cantcook.checked){
memeText.innerText =
"🍳 Can't Cook\n\nMaggi specialist only.";
}

/* ---------- NOTHING SELECTED ---------- */

else{
memeText.innerText =
"(Recomended)--> Officer Wife👮‍♂️ \n\n Good looking Optional 😆";
}

}

document.querySelectorAll(".toggle").forEach(toggle=>{
toggle.addEventListener("change",function(){
applyLogic(this);
});
});

</script>

</body>
</html>
