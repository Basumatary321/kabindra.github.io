 <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Finance App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">


</head>

<body>

<header>

<h2>Dashboard</h2>

<div>

<button id="installBtn" style="
background:#2563eb;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
display:none;
margin-right:10px;
">
Install
</button>

<i class="fa fa-bell"></i>

</div>

</header>


<!-- BALANCE -->

<div class="balance">

<p>Total Balance</p>

<h1 id="balance">₹0</h1>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
<i class="fa fa-wallet" style="color: orange;"></i>
<p>Cash</p>
<h3 id="cash">₹0</h3>
</div>

<div class="stat">
<i class="fa fa-building-columns" style="color: darkcyan;"></i>
<p>Bank</p>
<h3 id="bank">₹0</h3>
</div>

<div class="stat income">
<i class="fa fa-arrow-trend-up"></i>
<p>Income</p>
<h3 id="income">₹0</h3>
</div>

<div class="stat expense">
<i class="fa fa-arrow-trend-down"></i>
<p>Expense</p>
<h3 id="expense">₹0</h3>
</div>

</div>


<!-- TRANSACTIONS -->

<div class="section" id="history">

<h3 style="margin-bottom: 10px;">Recent Transactions</h3>

<div id="transactions"></div>

</div>


<!-- REPORTS -->

<div id="reports">

<h3 style="margin-bottom: 10px;">Analytics</h3>

<canvas id="chart1"></canvas>
<canvas id="chart2"></canvas>

</div>
<!-- fee dashboard -->




<!-- FLOAT BUTTON -->

<div class="fab" onclick="handleFab()">
<i class="fa fa-plus"></i>
</div>


<!-- FORM -->

<div class="form" id="form">

<input id="desc" name="desc" placeholder="Description">
<!-- <textarea name="desc" id="desc" placeholder="Description" value="Expenses"></textarea> -->

<input id="amount" type="number" placeholder="+income / -expense">

<select id="mode">
<option>Cash</option>
<option>Bank</option>
<option>UPI</option>
</select>
<div class="actions" style="float: right;">
<button onclick="closeT()" id="closeT">Close</button>
<button onclick="addTransaction()">Save</button>
</div>

</div>

<!-- DELETE POPUP -->

<div id="deletePopup" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
">

<div style="
background:#1e293b;
padding:20px;
border-radius:15px;
width:260px;
text-align:center;
">

<h3>Delete Transaction?</h3>
<p>This action cannot be undone</p>

<div style="display:flex;gap:10px;margin-top:15px;">

<button onclick="closeDelete()" style="flex:1;padding:8px;border:none;border-radius:8px;">
Cancel
</button>

<button onclick="confirmDelete()" style="flex:1;padding:8px;border:none;border-radius:8px;background:#ef4444;color:white;">
Delete
</button>

</div>

</div>
</div>
<!-- BOTTOM NAV -->

<nav>

<div onclick="showDashboard()">
<i class="fa fa-home"></i>
<p>Home</p>
</div>

<div onclick="showHistory()">
<i class="fa fa-clock"></i>
<p>History</p>
</div>

<a href="fee.html" class="navItem">

<i class="fa fa-money-bill"></i>
<p>Fees</p>

</a>

<div onclick="showReports()">
<i class="fa fa-chart-line"></i>
<p>Reports</p>
</div>

<div onclick="alert('Settings soon')">
<i class="fa fa-gear"></i>
<p>Settings</p>
</div>

</nav>


<script>

</script>
<script src="script.js"></script>
</body>
</html>
