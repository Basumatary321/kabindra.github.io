<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Crush 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    font-family:'Pacifico',cursive;
    background:radial-gradient(circle at top,#2b1055,#000);
    color:white;
    overflow:hidden;
}

/* HEART RAIN (LEVEL 4 STYLE) */
.heart{
    position:fixed;
    top:-10px;
    font-size:18px;
    animation:fall linear infinite;
    pointer-events:none;
    z-index:0;
}
@keyframes fall{
    to{transform:translateY(110vh);opacity:0}
}

/* CENTER */
.container{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
}

/* CARD */
.card{
    width:92%;
    max-width:360px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

/* SLIDES */
.slide{display:none;font-size:22px;line-height:1.4}
.slide.active{display:block}

/* PROPOSAL */
#loveText{
    font-size:26px;
    color:#ffb6c1;
}
#request{
    font-size:16px;
    margin:10px 0 15px;
}

/* BUTTONS */
.buttons{
    display:flex;
    gap:12px;
    justify-content:center;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:18px;
    font-size:16px;
    font-family:'Pacifico',cursive;
}

.yes{background:#2ecc71;color:white}
.no{background:#ff7675;color:white}
.whatsapp{background:#25D366;color:white}

/* RING */
#ring{
    font-size:60px;
    animation:ring 1.2s infinite alternate;
}
@keyframes ring{
    from{transform:scale(1)}
    to{transform:scale(1.15)}
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<!-- STORY SLIDES -->
<div class="slide active">
    Hey… 👋  
    <br>Tap anywhere 💕
</div>

<div class="slide">
    I didn’t plan this…  
    <br>it just happened 💭
</div>

<div class="slide">
    Somehow you became  
    <br>my favorite thought ✨
</div>

<div class="slide">
    So I made this…  
    <br>just for you ❤️
</div>

<!-- PROPOSAL -->
<div class="slide" id="proposal">
    <div id="loveText">I Love You ❤️</div>
    <div id="request">Please be mine… 🥺</div>

    <div class="buttons">
        <button class="yes" onclick="sayYes()">Yes 💖</button>
        <button class="no" onclick="sayNo()">No 🙈</button>
    </div>
</div>

<!-- SUCCESS -->
<div class="slide" id="success">
    <div id="ring">💍</div>
    <div style="font-size:24px;margin-top:10px">
        She said YES 🥰
    </div>
    <button class="whatsapp" onclick="sendWhatsApp()">
        Reply on WhatsApp 💚
    </button>
</div>

</div>
</div>

<script>
/* ❤️ HEART RAIN */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=3+Math.random()*3+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},350);

/* STORY FLOW */
const slides=document.querySelectorAll(".slide");
let index=0;

document.body.addEventListener("click",()=>{
    if(index < slides.length - 2){
        slides[index].classList.remove("active");
        index++;
        slides[index].classList.add("active");
    }
});

/* LOVE TEXT WITH FLAGS */
const loveData=[
 {text:"I Love You", flag:"🇺🇸"},
{text:"मैं तुमसे प्यार करता हूँ", flag:"🇮🇳"},
 {text:"आं नोंखौ मोजां मोनो", flag:"🥰"} ,
{text:"Ame Tomake Bhalobasi", flag:"🇮🇳"},
 {text:"Moi tumak bhal pao", flag:"🥰"},
{text:"म तिमीलाई माया गर्छु",flag:"🇳🇵"},
 {text:"Te Amo", flag:"🇪🇸"},
 {text:"Je t’aime", flag:"🇫🇷"},
 {text:"Ich liebe dich", flag:"🇩🇪"},
 {text:"Ti amo", flag:"🇮🇹"}
];

let noCount=0;

function sayNo(){
    noCount++;
    const d = loveData[noCount % loveData.length];
    document.getElementById("loveText").innerText =
        `${d.text} ❤️ ${d.flag}`;
}

/* YES */
function sayYes(){
    slides[index].classList.remove("active");
    document.getElementById("success").classList.add("active");
}

/* WHATSAPP DIRECT REPLY */
const YOUR_NUMBER = "916000537626"; // 🔴 CHANGE THIS

function sendWhatsApp(){
    const msg = encodeURIComponent(
        "Yes ❤️\nI saw your page…\nAnd I smiled 😊"
    );
    window.open(
        `https://wa.me/${YOUR_NUMBER}?text=${msg}`,
        "_blank"
    );
}
</script>

</body>
</html>
