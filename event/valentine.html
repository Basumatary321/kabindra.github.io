<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Little Letter 💌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Handwritten Font -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Heart Rain -->
<div class="heart-rain"></div>

<div class="letter">
  <div class="paper">

    <h1>Dear You 🌸</h1>

    <!-- Mini Question -->
    <p id="miniText">
      Before anything…<br>
      do you like cute surprises? 😊
    </p>

    <div class="buttons" id="miniButtons">
      <button id="miniYes">Yes 🤍</button>
      <button id="miniNo">Maybe 😅</button>
    </div>

    <!-- Proposal -->
    <p class="question" id="proposal">
      Then I wanted to ask…<br>
      Will you be my Valentine? 💖
    </p>

    <div class="buttons" id="mainButtons">
      <button id="yes">Yes 😳</button>
      <button id="no">No 🙃</button>
    </div>

    <!-- Love Languages -->
    <p id="loveText"></p>

    <!-- Result -->
    <div class="result">
      <p>
        You just made my heart very happy 🥹💘<br>
        No pressure, no rush — just smiles 🌷
      </p>

      <a id="whatsapp" target="_blank">💬 Share on WhatsApp</a>
    </div>

    <p class="sign">— someone who thinks you’re special ✨</p>

  </div>
</div>

<script>
/* Hide proposal initially */
proposal.style.display = "none";
mainButtons.style.display = "none";

/* Mini question logic */
function showProposal() {
  miniText.innerHTML = "Okay… this is my little surprise 🙈";
  miniButtons.style.display = "none";

  setTimeout(() => {
    proposal.style.display = "block";
    mainButtons.style.display = "block";
  }, 1200);
}
miniYes.onclick = showProposal;
miniNo.onclick = showProposal;

/* Love languages on NO click */
const loveLanguages = [
  "❤️ I love you (English)",
  "🇪🇸 Te amo",
  "🇫🇷 Je t’aime",
  "🇩🇪 Ich liebe dich",
  "🇮🇹 Ti amo",
  "🇯🇵 愛してる",
  "🇰🇷 사랑해",
  "🇨🇳 我爱你",
  "🇷🇺 Я тебя люблю",
  "🇮🇳 मैं तुमसे प्यार करता हूँ",
  "❤️ आं नोंखौ मोजां मोनो (Bodo)"
];

let loveIndex = 0;
no.onclick = () => {
  loveText.style.display = "block";
  loveText.classList.remove("fade");
  void loveText.offsetWidth; // restart animation
  loveText.classList.add("fade");

  loveText.innerText = loveLanguages[loveIndex];
  loveIndex = (loveIndex + 1) % loveLanguages.length;

  // playful move
  no.style.position = "absolute";
  no.style.left = Math.random() * 60 + "%";
  no.style.top = Math.random() * 60 + "%";
};

/* YES click */
yes.onclick = () => {
  result.style.display = "block";
  yes.style.display = "none";
  no.style.display = "none";

  const msg = encodeURIComponent(
    "Someone sent me the cutest handwritten love letter 🥹💌\nYou should see this:"
  );
  whatsapp.href = `https://wa.me/?text=${msg} ${window.location.href}`;
};

/* Heart rain */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 3) + "s";
  document.querySelector(".heart-rain").appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 500);
</script>

</body>
</html>
