<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Crush 💖</title>

<!-- Handwritten Font -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: 'Pacifico', cursive;
    overflow: hidden;
}

/* Heart Rain */
.heart {
    position: fixed;
    top: -10px;
    font-size: 18px;
    animation: fall linear infinite;
    color: rgba(255,0,80,0.8);
}
@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}

/* Card */
.container {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: white;
    padding: 25px;
    width: 90%;
    max-width: 360px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    color: #ff2e63;
    font-size: 26px;
}

.question {
    font-size: 20px;
    margin: 20px 0;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
    text-align: center;
}

button {
    margin-top: 15px;
    padding: 12px 18px;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Pacifico', cursive;
}

.start-btn {
    background: #ff2e63;
    color: white;
}

/* Proposal */
#proposal {
    display: none;
}

#loveText {
    font-size: 22px;
    color: #ff2e63;
    margin-bottom: 8px;
}

#requestLine {
    font-size: 16px;
    margin-bottom: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.yes {
    background: #2ecc71;
    color: white;
}

.no {
    background: #ff7675;
    color: white;
}

/* After Yes */
#success {
    display: none;
}

.share {
    background: #25D366;
    color: white;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <!-- STEP 1 -->
        <div id="step1">
            <h1>Hey You 💌</h1>
            <div class="question">
                Before I say something…  
                <br>Are you smiling right now? 😊
            </div>
            <input type="text" placeholder="type yes / maybe">
            <button class="start-btn" onclick="startLove()">Continue 💕</button>
        </div>

        <!-- STEP 2 -->
        <div id="proposal">
            <div id="loveText">I Love You ❤️</div>
            <div id="requestLine">Please… will you be mine? 🥺</div>

            <div class="buttons">
                <button class="yes" onclick="sayYes()">Yes 💖</button>
                <button class="no" onclick="sayNo()">No 🙈</button>
            </div>
        </div>

        <!-- STEP 3 -->
        <div id="success">
            <h1>Yayyy 🥰</h1>
            <div class="question">
                You just made my heart very happy 💕
            </div>
            <button class="share" onclick="shareLove()">Share on WhatsApp 💚</button>
        </div>

    </div>
</div>

<script>
/* Heart Rain */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = 2 + Math.random() * 3 + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 300);

/* Logic */
const loveLanguages = [
    "I Love You ❤️",
    "Te Amo 💕",
    "Je t’aime 💖",
    "Ich liebe dich 💘",
    "Ti amo 💓",
    "मैं तुमसे प्यार करता हूँ ❤️",
    "आं नोंखौ मोजां मोनो 💞",
    "Saranghae 💗",
    "Aishiteru 💝"
];

let noCount = 0;

function startLove() {
    document.getElementById("step1").style.display = "none";
    document.getElementById("proposal").style.display = "block";
}

function sayNo() {
    noCount++;
    const text = loveLanguages[noCount % loveLanguages.length];
    document.getElementById("loveText").innerText = text;
}

function sayYes() {
    document.getElementById("proposal").style.display = "none";
    document.getElementById("success").style.display = "block";
}

function shareLove() {
    const msg = encodeURIComponent(
        "Someone made this cute love letter for you 💖👇\n" +
        window.location.href
    );
    window.open(`https://wa.me/?text=${msg}`, "_blank");
}
</script>

</body>
</html>
